<!DOCTYPE html>
<html lang="en" data-theme="battery">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Laptop Finder — Details</title>
  <script>
    
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem("laptopFinderTheme"));
        if (saved === "battery" || saved === "performance") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (error) { /* keep the default theme */ }
    })();
  </script>
  <link rel="stylesheet" href="dist/output.css">
</head>
<body class="min-h-screen flex flex-col bg-bg text-text antialiased">
  <header id="site-header" class="sticky top-0 z-30 border-b border-border bg-surface">
    <noscript><a href="index.html" class="block p-4 font-semibold">Student Laptop Finder</a></noscript>
  </header>

  <main class="mx-auto w-full max-w-5xl flex-1 px-4 py-8 sm:px-6 lg:px-8">
    <a href="laptops.html" class="inline-block text-sm font-semibold text-accent hover:underline">&larr; Back to Catalogue</a>
    <div id="details-error" class="mt-6 hidden rounded-xl border border-danger-border bg-danger-bg p-4 text-sm text-danger"></div>
    <section id="details-container" class="mt-6"></section>
  </main>

  <footer id="site-footer" class="border-t border-border bg-surface"></footer>
  <script type="module" src="src/js/details.js"></script>
</body>
</html>
